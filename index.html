<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestionnaire de scène — Prototype</title>
<style>
  :root {
    --bg-void: #0a0e12;
    --panel: #10171d;
    --panel-edge: #1c2830;
    --ink: #d8e2e6;
    --ink-dim: #7c8f97;
    --gold: #c9a961;
    --gold-soft: rgba(201, 169, 97, 0.35);
    --danger: #8a3a3a;
    --edit: #4a90a4;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-void);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ---------- Topbar ---------- */
  #topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-edge);
    flex-shrink: 0;
    z-index: 50;
  }
  #topbar .title {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: var(--gold);
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .mode-switch {
    display: flex;
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    overflow: hidden;
  }
  .mode-switch button {
    background: none;
    border: none;
    color: var(--ink-dim);
    padding: 7px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .mode-switch button.active {
    background: var(--gold-soft);
    color: var(--gold);
  }
  .mode-switch button:hover:not(.active) {
    color: var(--ink);
    background: rgba(255,255,255,0.04);
  }
  #breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--ink-dim);
    flex-wrap: wrap;
    flex: 1;
    min-width: 0;
  }
  #breadcrumb .crumb {
    cursor: pointer;
    padding: 3px 8px;
    border-radius: 5px;
    white-space: nowrap;
  }
  #breadcrumb .crumb:hover { background: rgba(255,255,255,0.06); color: var(--ink); }
  #breadcrumb .crumb.current { color: var(--gold); cursor: default; }
  #breadcrumb .crumb.current:hover { background: none; }
  #breadcrumb .sep { color: var(--panel-edge); }

  #audio-toggle {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #audio-toggle.on { color: var(--gold); border-color: var(--gold-soft); }

  #disk-open-root {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #launch-player-window {
    background: none;
    border: 1px solid var(--edit);
    color: var(--edit);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #launch-player-window:hover { background: var(--edit); color: #06181e; }
  #disk-scene-select {
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.8rem;
    max-width: 160px;
  }
  #music-volume {
    width: 80px;
    accent-color: var(--gold);
  }
  body.mode-player #music-volume { display: none !important; }

  #disk-delete-scene {
    background: none;
    border: 1px solid var(--danger);
    color: #e08a8a;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }

  #draw-toggle {
    background: none;
    border: 1px solid var(--edit);
    color: var(--edit);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
    display: none;
  }
  body.mode-edit #draw-toggle { display: inline-block; }
  #draw-toggle.on { background: var(--edit); color: #06181e; }

  /* ---------- Layout ---------- */
  #body-layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #stage-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    min-width: 0;
  }
  #stage {
    position: relative;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 768 / 512;
    width: min(100%, calc((100vh - 60px) * 768 / 512));
  }
  #stage img.bg {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }
  #stage svg.zones {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .zone-shape {
    fill: rgba(201, 169, 97, 0.0);
    stroke: transparent;
    stroke-width: 2;
    cursor: pointer;
    transition: fill .15s, stroke .15s;
    vector-effect: non-scaling-stroke;
  }
  body.mode-edit .zone-shape {
    fill: rgba(74, 144, 164, 0.12);
    stroke: var(--edit);
    stroke-dasharray: 6 4;
  }
  body.mode-mj .zone-shape {
    stroke: rgba(201, 169, 97, 0.25);
  }
  body.mode-mj .zone-shape:hover,
  body.mode-edit .zone-shape:hover {
    fill: rgba(201, 169, 97, 0.18);
    stroke: var(--gold);
  }
  .zone-shape.sound-on {
    stroke: var(--gold);
    stroke-width: 3;
    animation: pulse-stroke 1.8s ease-in-out infinite;
  }
  @keyframes pulse-stroke {
    0%, 100% { stroke-opacity: 0.5; }
    50% { stroke-opacity: 1; }
  }
  .zone-label {
    position: absolute;
    transform: translate(-50%, -100%);
    background: var(--bg-void);
    color: var(--gold);
    font-size: 0.72rem;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid var(--gold-soft);
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .15s;
  }
  body.mode-edit .zone-label { opacity: 1; }
  .zone-shape:hover + .zone-label { opacity: 1; }

  /* ---------- Inserts (cascade) ---------- */
  #insert-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .insert-card {
    position: absolute;
    pointer-events: auto;
    background: var(--panel);
    border: 1px solid var(--gold-soft);
    border-radius: 10px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    width: 78%;
    height: 78%;
    top: 11%;
    left: 11%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: insert-in .28s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes insert-in {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .insert-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--bg-void);
    border-bottom: 1px solid var(--panel-edge);
    flex-shrink: 0;
  }
  .insert-head .name {
    font-size: 0.85rem;
    color: var(--gold);
  }
  .insert-head .close-btn {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 6px;
    width: 26px;
    height: 26px;
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
  }
  .insert-head .close-btn:hover { color: var(--ink); border-color: var(--gold-soft); }
  .insert-body {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  .insert-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 20px;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 14px),
      linear-gradient(160deg, #162026, #0d1216);
  }
  .insert-placeholder .icon { font-size: 2.2rem; opacity: 0.8; }
  .insert-placeholder .cap { color: var(--ink-dim); font-size: 0.8rem; max-width: 320px; }

  /* ---------- Portrait (visuel partagé : zones legacy + NPC) ---------- */
  @keyframes portrait-in {
    from { opacity: 0; transform: translate(-50%, 40px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .portrait-visual {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .portrait-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 14px 28px rgba(0,0,0,0.65));
  }
  .portrait-placeholder {
    width: 100%;
    height: 75%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(160deg, #162026, #0d1216);
    border: 1px solid var(--gold-soft);
    border-radius: 10px;
  }
  .portrait-name {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 20, 24, 0.9);
    border: 1px solid var(--gold-soft);
    color: var(--gold);
    padding: 4px 16px;
    border-radius: 6px;
    font-size: 0.8rem;
    white-space: nowrap;
    z-index: 5;
  }

  .portrait-card {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 88%;
    pointer-events: auto;
    animation: portrait-in 0.25s ease-out;
  }
  .portrait-card .portrait-close {
    position: absolute;
    top: 0;
    right: 6px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--panel-edge);
    background: rgba(10, 20, 24, 0.85);
    color: var(--ink-dim);
    cursor: pointer;
    z-index: 5;
  }
  .portrait-card .portrait-close:hover { color: var(--ink); border-color: var(--gold-soft); }

  /* ---------- Effets météo ---------- */
  #weather-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
    display: none;
  }
  #weather-fog {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 6;
    display: none;
  }
  #weather-fog .fog-base {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(255,255,255,0.24), rgba(255,255,255,0.05) 75%);
    mix-blend-mode: screen;
    animation: fog-base-pulse 15s ease-in-out infinite;
  }
  @keyframes fog-base-pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.85; }
  }
  #weather-fog .fog-texture {
    position: absolute;
    inset: -2% -2%;
    background-repeat: repeat;
    mix-blend-mode: screen;
    filter: blur(6px);
    will-change: background-position;
  }
  #weather-fog .ft1 {
    background-size: 640px 640px;
    opacity: 0.3;
    animation: fog-scroll-1 90s linear infinite;
  }
  #weather-fog .ft2 {
    background-size: 460px 460px;
    opacity: 0.2;
    animation: fog-scroll-2 130s linear infinite;
  }
  @keyframes fog-scroll-1 {
    from { background-position: 0px 0px; }
    to   { background-position: -640px -640px; }
  }
  @keyframes fog-scroll-2 {
    from { background-position: 0px 0px; }
    to   { background-position: 460px 460px; }
  }
  #weather-fog .fog-tint {
    position: absolute;
    inset: 0;
    background: rgba(150, 158, 168, 0.1);
  }

  /* ---------- Orage (éclair) ---------- */
  #weather-storm {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 7;
    display: none;
  }
  #weather-storm .flash {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(222, 232, 255, 0.95), rgba(222, 232, 255, 0) 55%);
    opacity: 0;
  }

  /* ---------- Portraits NPC (panneau "Personnages") ---------- */
  #npc-portrait-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .npc-portrait {
    position: absolute;
    bottom: 0;
    transform: translateX(-50%);
    height: 88%;
    pointer-events: none;
    animation: portrait-in 0.25s ease-out;
    z-index: 8;
    display: flex;
    align-items: flex-end;
  }
  .npc-portrait .npc-portrait-img {
    height: 100%;
    width: auto;
    display: block;
    filter: drop-shadow(0 14px 28px rgba(0,0,0,0.65));
  }
  .npc-portrait .npc-portrait-placeholder {
    height: 75%;
    width: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(160deg, #162026, #0d1216);
    border: 1px solid var(--gold-soft);
    border-radius: 10px;
  }

  /* ---------- Side panel ---------- */
  #side-panel {
    width: 300px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--panel-edge);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  #side-panel h3 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    margin: 14px 14px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #npc-refresh, #notes-refresh, #notes-pick {
    background: none;
    border: none;
    color: var(--ink-dim);
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    text-transform: none;
    letter-spacing: normal;
  }
  #npc-refresh:hover, #notes-refresh:hover, #notes-pick:hover { color: var(--gold); }
  .h3-actions { display: flex; gap: 8px; }
  #npc-checklist { padding-bottom: 10px; }
  #weather-panel {
    padding: 0 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .weather-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--ink);
    cursor: pointer;
  }
  .weather-row input { accent-color: var(--gold); cursor: pointer; }
  .weather-slider {
    width: 100%;
    accent-color: var(--gold);
    margin: -2px 0 4px;
  }
  #npc-checklist .empty {
    color: var(--ink-dim);
    font-style: italic;
    font-size: 0.8rem;
    padding: 0 14px;
    display: block;
  }
  .npc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    font-size: 0.85rem;
    color: var(--ink);
    cursor: pointer;
  }
  .npc-row:hover { background: rgba(255,255,255,0.03); }
  .npc-row input[type="checkbox"] { cursor: pointer; }
  .accordion-item {
    border-bottom: 1px solid var(--panel-edge);
  }
  .accordion-item .acc-head {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 0.88rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--ink);
  }
  .accordion-item .acc-head:hover { background: rgba(255,255,255,0.03); }
  .accordion-item .acc-arrow {
    transition: transform .15s;
    color: var(--gold);
    font-size: 0.75rem;
  }
  .accordion-item.open .acc-arrow { transform: rotate(90deg); }
  .accordion-item .acc-body {
    max-height: 0;
    overflow-y: auto;
    transition: max-height .2s ease;
    font-size: 0.82rem;
    color: var(--ink-dim);
    line-height: 1.5;
  }
  .accordion-item.open .acc-body { max-height: 340px; }
  .accordion-item .acc-body-inner { padding: 0 14px 14px; }
  .note-text {
    white-space: pre-wrap;
    font-size: 0.82rem;
    line-height: 1.55;
    color: var(--ink);
  }
  .note-pdf {
    width: 100%;
    height: 320px;
    border: none;
    border-radius: 6px;
    background: #fff;
  }
  #notes-viewer { padding: 0 14px 14px; }
  #notes-viewer .empty { color: var(--ink-dim); font-style: italic; font-size: 0.8rem; }
  #notes-summary { padding: 0 14px 14px; }
  #notes-summary .empty { color: var(--ink-dim); font-style: italic; font-size: 0.8rem; }
  .notes-open-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 0.83rem;
    cursor: pointer;
    word-break: break-all;
  }
  .notes-open-btn:hover { border-color: var(--gold-soft); color: var(--gold); }

  .notes-floating-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.62);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .notes-floating-overlay.hidden { display: none; }
  .notes-floating-panel {
    width: 88vw;
    height: 88vh;
    background: var(--panel);
    border: 1px solid var(--gold-soft);
    border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .notes-floating-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: var(--bg-void);
    border-bottom: 1px solid var(--panel-edge);
    cursor: pointer;
    flex-shrink: 0;
  }
  .notes-floating-header span {
    color: var(--gold);
    font-size: 0.95rem;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
  }
  #notes-floating-close {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 6px;
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-size: 1rem;
  }
  #notes-floating-close:hover { color: var(--ink); border-color: var(--gold-soft); }
  .notes-floating-body {
    flex: 1;
    overflow: auto;
    padding: 22px 30px;
    min-height: 0;
  }
  .notes-floating-body .note-text {
    font-size: 1.05rem;
    line-height: 1.75;
    max-height: none;
  }
  .notes-floating-body .doc-text-view {
    max-height: none;
    overflow: visible;
  }
  .notes-floating-body .doc-pdf-frame,
  .notes-floating-body .note-pdf {
    width: 100%;
    height: calc(88vh - 150px);
  }
  .notes-floating-body .doc-file-name {
    font-size: 0.8rem;
  }
  .doc-text-view {
    max-height: 46vh;
    overflow-y: auto;
    padding-right: 4px;
  }
  .doc-pdf-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    font-size: 0.8rem;
    color: var(--ink-dim);
  }
  .doc-pdf-controls input[type="number"] {
    width: 56px;
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 0.8rem;
  }
  .doc-pdf-controls button {
    background: none;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .doc-pdf-controls button:hover { color: var(--gold); border-color: var(--gold-soft); }
  .doc-pdf-frame { height: 44vh; }
  .doc-file-name {
    font-size: 0.75rem;
    color: var(--ink-dim);
    margin-bottom: 8px;
    word-break: break-all;
  }

  .zone-info-box {
    margin: 10px 14px;
    padding: 12px;
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    font-size: 0.82rem;
  }
  .zone-info-box .row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .zone-info-box .row .k { color: var(--ink-dim); }
  .zone-info-box .row .v { color: var(--ink); text-align: right; }
  .zone-info-box .empty { color: var(--ink-dim); font-style: italic; }
  .zone-info-box .zi-label {
    display: block;
    font-size: 0.72rem;
    color: var(--ink-dim);
    margin: 2px 0 4px;
  }
  .zone-info-box input[type="text"],
  .zone-info-box select {
    width: 100%;
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .zone-info-box .zi-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }
  .zone-info-box .zi-actions button {
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 0.8rem;
    cursor: pointer;
    border: 1px solid var(--edit);
    background: none;
    color: var(--edit);
  }
  .zone-info-box .zi-actions button.danger {
    border-color: var(--danger);
    color: #e08a8a;
  }

  /* ---------- Player mode: strip everything ---------- */
  body.mode-player #topbar,
  body.mode-player #side-panel,
  body.mode-player #notes-floating-overlay,
  body.mode-player .zone-label {
    display: none !important;
  }
  body.mode-player .zone-shape { stroke: transparent !important; fill: transparent !important; cursor: default; }
  body.mode-player #body-layout { }
  body.mode-player #stage-wrap { background: #000; }

  body.drawing-mode .zone-shape:not(.draw-vertex) { pointer-events: none; }
  body.drawing-mode #stage { cursor: crosshair; }

  .draw-capture {
    fill: transparent;
    pointer-events: all;
  }
  .draw-vertex {
    fill: var(--gold);
    stroke: #06181e;
    stroke-width: 1.5;
    r: 5;
    vector-effect: non-scaling-stroke;
  }
  .draw-preview-line {
    fill: rgba(74, 144, 164, 0.15);
    stroke: var(--edit);
    stroke-width: 2;
    stroke-dasharray: 5 4;
    vector-effect: non-scaling-stroke;
  }

  .draw-hint-bar {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    color: var(--ink);
    background: rgba(10, 20, 24, 0.9);
    border: 1px solid var(--edit);
    padding: 6px 14px;
    border-radius: 8px;
    z-index: 60;
    white-space: nowrap;
  }

  .zone-form-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 70;
  }
  .zone-form {
    background: var(--panel);
    border: 1px solid var(--gold-soft);
    border-radius: 10px;
    padding: 20px;
    width: 300px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }
  .zone-form h4 {
    margin: 0 0 14px;
    color: var(--gold);
    font-size: 0.95rem;
    font-weight: 500;
  }
  .zone-form label {
    display: block;
    font-size: 0.75rem;
    color: var(--ink-dim);
    margin: 10px 0 4px;
  }
  .zone-form input[type="text"],
  .zone-form select {
    width: 100%;
    background: var(--bg-void);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    padding: 7px 9px;
    border-radius: 6px;
    font-size: 0.85rem;
  }
  .zone-form .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  .zone-form button {
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 0.82rem;
    cursor: pointer;
    border: 1px solid var(--panel-edge);
    background: none;
    color: var(--ink-dim);
  }
  .zone-form button.primary {
    background: var(--gold-soft);
    border-color: var(--gold);
    color: var(--gold);
  }
  .zone-form .note {
    font-size: 0.72rem;
    color: var(--ink-dim);
    margin-top: 12px;
    line-height: 1.4;
  }

  .hint {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.72rem;
    color: var(--ink-dim);
    background: rgba(0,0,0,0.5);
    padding: 4px 10px;
    border-radius: 12px;
    pointer-events: none;
  }
</style>
</head>
<body class="mode-mj">
<div id="app">

  <div id="topbar">
    <div class="title">Ombres de Chicago — Bureau de Francis</div>
    <div class="mode-switch">
      <button data-mode="edit">Édition</button>
      <button data-mode="mj" class="active">MJ</button>
    </div>
    <button id="disk-open-root">📁 Dossier scénario</button>
    <button id="launch-player-window" title="Ouvrir la vue Joueur dans une nouvelle fenêtre, sur le 2e écran si possible">🖥️ Vue Joueur →</button>
    <select id="disk-scene-select" style="display:none;"></select>
    <button id="disk-delete-scene" style="display:none;">🗑️ Supprimer la scène</button>
    <div id="breadcrumb"></div>
    <button id="draw-toggle">✏️ Créer une zone</button>
    <button id="audio-toggle">🔈 Activer le son</button>
    <input type="range" id="music-volume" min="0" max="100" value="70" title="Volume de la musique">
  </div>

  <div id="body-layout">
    <div id="stage-wrap">
      <div id="stage">
        <img class="bg" id="scene-bg" src="" alt="Décor de la scène">
        <svg class="zones" id="zone-svg" viewBox="0 0 768 512" preserveAspectRatio="none"></svg>
        <div id="labels-layer"></div>
        <div id="npc-portrait-layer"></div>
        <canvas id="weather-canvas"></canvas>
        <div id="weather-fog">
          <div class="fog-base"></div>
          <div class="fog-texture ft1"></div>
          <div class="fog-texture ft2"></div>
          <div class="fog-tint"></div>
        </div>
        <div id="weather-storm"><div class="flash"></div></div>
        <div id="insert-layer"></div>
        <div class="hint" id="mode-hint"></div>
      </div>
    </div>
    <div id="side-panel">
      <h3>Zone sélectionnée</h3>
      <div id="zone-info" class="zone-info-box"><span class="empty">Clique une zone pour voir ses réglages.</span></div>

      <h3>Notes de scénario
        <span class="h3-actions">
          <button id="notes-pick" title="Choisir le fichier">📁</button>
          <button id="notes-refresh" title="Actualiser">🔄</button>
        </span>
      </h3>
      <div id="notes-summary"><span class="empty">Ouvre un dossier de scénario.</span></div>

      <h3>Personnages <button id="npc-refresh" title="Actualiser la liste">🔄</button></h3>
      <div id="npc-checklist"></div>

      <h3>Météo</h3>
      <div id="weather-panel">
        <label class="weather-row"><input type="checkbox" id="weather-rain-toggle"> 🌧️ Pluie</label>
        <input type="range" id="rain-intensity" class="weather-slider" min="10" max="100" value="50" title="Intensité de la pluie" style="display:none;">
        <label class="weather-row"><input type="checkbox" id="weather-snow-toggle"> ❄️ Neige</label>
        <input type="range" id="snow-intensity" class="weather-slider" min="10" max="100" value="50" title="Intensité de la neige" style="display:none;">
        <label class="weather-row"><input type="checkbox" id="weather-fog-toggle"> 🌫️ Brouillard</label>
        <label class="weather-row"><input type="checkbox" id="weather-storm-toggle"> ⛈️ Orage</label>
      </div>
    </div>
  </div>

  <div id="notes-floating-overlay" class="notes-floating-overlay hidden">
    <div class="notes-floating-panel">
      <div class="notes-floating-header" id="notes-floating-header">
        <span id="notes-floating-title">Notes de scénario</span>
        <button id="notes-floating-close" title="Réduire">✕</button>
      </div>
      <div id="notes-floating-body" class="notes-floating-body"></div>
    </div>
  </div>

</div>

  // seulement si une scène est chargée — trop risqué à côté du simple
  // changement de scène sinon.
  function updateDeleteBtnVisibility() {
    diskDeleteBtn.style.display = (state.mode === "edit" && currentSceneName) ? "inline-block" : "none";
  }

  // ---------------------------------------------------------------
  // Branchement disque (File System Access API)
  // ---------------------------------------------------------------

  let diskMode = false;
  let rootDirHandle = null;

  let npcList = []; // { fileName, displayName }

  const npcObjectURLs = {};
  const SLOT_POSITIONS = ["12%", "88%", "38%", "62%"];
  let weatherRain = false;
  let weatherSnow = false;
  let weatherFog = false;
  let weatherStorm = false;
  let rainIntensity = 50; // 10-100
  let snowIntensity = 50; // 10-100
  let musicVolume = 70; // 0-100
  let weatherAnimId = null;
  let rainDrops = [];
  let snowFlakes = [];
  let stormFlashTimeout = null;

  const stormAmbienceEl = new Audio();
  stormAmbienceEl.loop = true;
  const zoneAudioEls = {};
  const musicAudioEl = new Audio();
  musicAudioEl.loop = true;
  musicAudioEl.volume = musicVolume / 100;

  function fsApiSupported() {
    return "showDirectoryPicker" in window;
  }

  function showToast(msg, isError) {
    let t = document.getElementById("disk-toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "disk-toast";
      t.className = "hint";
      t.style.top = "10px";
      t.style.bottom = "auto";
      document.getElementById("stage").appendChild(t);
    }
    t.textContent = msg;
    t.style.borderColor = isError ? "var(--danger)" : "var(--gold-soft)";
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => { if (t.parentNode) t.remove(); }, 4000);
  }

  async function writeFileIntoDir(dirHandle, fileName, fileObj) {
    const fh = await dirHandle.getFileHandle(fileName, { create: true });
    const w = await fh.createWritable();
    await w.write(fileObj);
    await w.close();
  }

  async function writeJsonIntoDir(dirHandle, fileName, obj) {
    const fh = await dirHandle.getFileHandle(fileName, { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify(obj, null, 2));
    await w.close();
  }

  function cleanForSave(list) {
    return JSON.parse(JSON.stringify(list, (key, val) => (key && key.indexOf("_") === 0) ? undefined : val));
  }

  async function saveSceneToDisk() {
    if (!diskMode || !currentSceneDirHandle) return;
    try {
      const sceneData = {
        name: loadedSceneNames[currentSceneName] || currentSceneName,
        background: currentSceneMeta.background,
        music: currentSceneMeta.music,
        zones: cleanForSave(ZONES),
        activeNpcs: activeNpcOrder.slice(),
        weatherRain: weatherRain,
        weatherSnow: weatherSnow,
        weatherFog: weatherFog,
        weatherStorm: weatherStorm,
        rainIntensity: rainIntensity,
        snowIntensity: snowIntensity,
        musicVolume: musicVolume
      };
      await writeJsonIntoDir(currentSceneDirHandle, "scene.json", sceneData);
    } catch (e) {
      showToast("Échec de l'enregistrement sur disque.", true);
    }
  }

  async function hydrateAssetURLs(list, sceneDir) {
    for (const z of list) {
      if ((z.type === "image" || z.type === "personnage") && z.insert && z.insert.assetFile) {
        try {
          const inserts = await sceneDir.getDirectoryHandle("inserts");
          const fh = await inserts.getFileHandle(z.insert.assetFile);
          const file = await fh.getFile();
          z.insert._url = URL.createObjectURL(file);
        } catch (e) {}
      }
      if (z.type === "son" && z.assetFile) {
        try {
          const sons = await sceneDir.getDirectoryHandle("sons");
          const fh = await sons.getFileHandle(z.assetFile);
          const file = await fh.getFile();
          z._url = URL.createObjectURL(file);
        } catch (e) {}
      }
      if (z.insert && z.insert.nested) await hydrateAssetURLs(z.insert.nested, sceneDir);
    }

  async function scanMeteoFolder() {
    if (rainSoundURL) { URL.revokeObjectURL(rainSoundURL); rainSoundURL = null; }
    if (stormSoundURL) { URL.revokeObjectURL(stormSoundURL); stormSoundURL = null; }
    rainAmbienceEl.pause();
    stormAmbienceEl.pause();
    rainAmbienceEl.src = "";
    stormAmbienceEl.src = "";
    if (!rootDirHandle) return;
    try {
      meteoDirHandle = await rootDirHandle.getDirectoryHandle("meteo", { create: true });
      for await (const [name, handle] of meteoDirHandle.entries()) {
        if (handle.kind !== "file" || !/\.(mp3|wav|ogg|m4a)$/i.test(name)) continue;
        const lower = name.toLowerCase();
        const isStorm = /orage|storm|thunder|tonnerre/.test(lower);
        const isRain = /pluie|rain/.test(lower);
        if (isStorm && !stormSoundURL) {
          const file = await handle.getFile();
          stormSoundURL = URL.createObjectURL(file);
          stormAmbienceEl.src = stormSoundURL;
        } else if (isRain && !rainSoundURL) {
          const file = await handle.getFile();
          rainSoundURL = URL.createObjectURL(file);
          rainAmbienceEl.src = rainSoundURL;
        }
      }
    } catch (e) {
      // dossier "meteo" illisible : pas grave, on reste sans ambiance auto
    }
  }

  // en vue Joueur, pour la même raison que la musique de scène (éviter le
  // double son si les deux fenêtres tournent sur la même machine).
  function updateWeatherAmbience() {

    rainAmbienceEl.volume = musicVolume / 100;
    stormAmbienceEl.volume = musicVolume / 100;
    if (canPlay && weatherRain && rainSoundURL) {
      rainAmbienceEl.play().catch(() => {});

    } else {

  }

  function deriveNpcName(fileName) {
    let base = fileName.replace(/\.[^.]+$/, "");
    let tokens = base.split(/[_\-\s]+/).filter(Boolean);
    tokens = tokens.filter(t => t.toLowerCase() !== "npc" && t.toLowerCase() !== "pnj");
    if (tokens.length === 0) tokens = [base];
    return tokens.map(t => t.charAt(0).toUpperCase() + t.slice(1)).join(" ");
  }

  async function scanNpcFolder() {
    npcList = [];
    // on vide le cache d'images pour forcer une relecture depuis le disque
    // (utile si un fichier a été remplacé en gardant le même nom)
    Object.keys(npcObjectURLs).forEach(fileName => {
      try { URL.revokeObjectURL(npcObjectURLs[fileName]); } catch (e) {}
      delete npcObjectURLs[fileName];
    });
    if (!rootDirHandle) { renderNpcChecklist(); return; }
    try {
      npcDirHandle = await rootDirHandle.getDirectoryHandle("npc", { create: true });
      for await (const [name, handle] of npcDirHandle.entries()) {
        if (handle.kind === "file" && /\.(png|jpe?g|webp|gif)$/i.test(name)) {
          npcList.push({ fileName: name, displayName: deriveNpcName(name) });
        }
      }
      npcList.sort((a, b) => a.displayName.localeCompare(b.displayName));
    } catch (e) {
      showToast('Impossible de lire le dossier "npc".', true);
    }
    renderNpcChecklist();
    if (activeNpcOrder.length) await hydrateActiveNpcImages();
  }

  function loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => resolve({ img, url });
      img.onerror = reject;
      img.src = url;
    });
  }

  function colorDistance(r1, g1, b1, r2, g2, b2) {
    const dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
    return Math.sqrt(dr * dr + dg * dg + db * db);
  }

  function trimByBackgroundColor(canvas, data) {
    const w = canvas.width, h = canvas.height;
    const px = (x, y) => { const i = (y * w + x) * 4; return [data[i], data[i + 1], data[i + 2]]; };
    const corners = [px(0, 0), px(w - 1, 0), px(0, h - 1), px(w - 1, h - 1)];
    const bgR = (corners[0][0] + corners[1][0] + corners[2][0] + corners[3][0]) / 4;
    const bgG = (corners[0][1] + corners[1][1] + corners[2][1] + corners[3][1]) / 4;
    const bgB = (corners[0][2] + corners[1][2] + corners[2][2] + corners[3][2]) / 4;
    const tol = 26;
    const rowStep = w > 2000 ? 2 : 1;
    const colStep = h > 2000 ? 2 : 1;
    const rowIsBg = (y) => {
      let match = 0, total = 0;
      for (let x = 0; x < w; x += rowStep) {
        total++;
        const i = (y * w + x) * 4;
        if (colorDistance(data[i], data[i + 1], data[i + 2], bgR, bgG, bgB) < tol) match++;
      }
      return match / total > 0.92;
    };
    const colIsBg = (x) => {
      let match = 0, total = 0;
      for (let y = 0; y < h; y += colStep) {
        total++;
        const i = (y * w + x) * 4;
        if (colorDistance(data[i], data[i + 1], data[i + 2], bgR, bgG, bgB) < tol) match++;
      }
      return match / total > 0.92;
    };
    let top = 0, bottom = h - 1, left = 0, right = w - 1;
    while (top < bottom && rowIsBg(top)) top++;
    while (bottom > top && rowIsBg(bottom)) bottom--;
    while (left < right && colIsBg(left)) left++;
    while (right > left && colIsBg(right)) right--;
    return { minX: left, minY: top, maxX: right, maxY: bottom };
  }

  async function trimTransparentPadding(file) {
    try {
      const { img, url } = await loadImageFromFile(file);
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      let data;
      try {
        data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      } catch (e) {
        return url; // lecture bloquée (rare en local) : on garde l'image telle quelle
      }

      // 1) essai par transparence (alpha)
      let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
      const threshold = 10;
      const step = canvas.width * canvas.height > 4000000 ? 2 : 1;
      for (let y = 0; y < canvas.height; y += step) {
        for (let x = 0; x < canvas.width; x += step) {
          const alpha = data[(y * canvas.width + x) * 4 + 3];
          if (alpha > threshold) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      let bbox = null;
      if (maxX >= minX && maxY >= minY) {
        const aw = maxX - minX + 1, ah = maxY - minY + 1;
        if (!(aw >= canvas.width * 0.98 && ah >= canvas.height * 0.98)) {
          bbox = { minX, minY, maxX, maxY };
        }
      }

      // 2) sinon, essai par couleur de fond dominante sur les bords
      if (!bbox) {
        const cb = trimByBackgroundColor(canvas, data);
        const cw = cb.maxX - cb.minX + 1, ch = cb.maxY - cb.minY + 1;
        if (cb.maxX > cb.minX && cb.maxY > cb.minY && !(cw >= canvas.width * 0.97 && ch >= canvas.height * 0.97)) {
          bbox = cb;
        }
      }

      if (!bbox) return url; // rien d'utile à recadrer
      const w = bbox.maxX - bbox.minX + 1;
      const h = bbox.maxY - bbox.minY + 1;
      const outCanvas = document.createElement("canvas");
      outCanvas.width = w;
      outCanvas.height = h;
      outCanvas.getContext("2d").drawImage(canvas, bbox.minX, bbox.minY, w, h, 0, 0, w, h);
      URL.revokeObjectURL(url);
      return await new Promise((resolve) => {
        outCanvas.toBlob((blob) => resolve(blob ? URL.createObjectURL(blob) : url), "image/png");
      });
    } catch (e) {
      return URL.createObjectURL(file);
    }
  }

  async function ensureNpcObjectURL(fileName) {
    if (npcObjectURLs[fileName]) return npcObjectURLs[fileName];
    if (!npcDirHandle) return null;
    try {
      const fh = await npcDirHandle.getFileHandle(fileName);
      const file = await fh.getFile();

      npcObjectURLs[fileName] = url;

      return url;
    } catch (e) {
      return null;
    }
  }

  const weatherCanvas = document.getElementById("weather-canvas");
  const weatherCtx = weatherCanvas.getContext("2d");
  const weatherFogEl = document.getElementById("weather-fog");

  function stopWeatherAnim() {
    if (weatherAnimId) { cancelAnimationFrame(weatherAnimId); weatherAnimId = null; }
  }

  function resizeWeatherCanvas() {
    const stageEl = document.getElementById("stage");
    const rect = stageEl.getBoundingClientRect();
    weatherCanvas.width = Math.max(1, Math.round(rect.width));
    weatherCanvas.height = Math.max(1, Math.round(rect.height));
    if (weatherRain) initRainDrops();
    if (weatherSnow) initSnowFlakes();
  }

  function initRainDrops() {
    const w = weatherCanvas.width, h = weatherCanvas.height;
    // t va de 0 (bruine, intensité 10) à 1 (torrentielle, intensité 100),
    // avec une courbe qui accélère vers le haut plutôt qu'une pente plate
    const t = Math.max(0, Math.min(1, (rainIntensity - 10) / 90));
    const factor = 0.22 + Math.pow(t, 1.3) * 3.6; // ~0.22x à ~3.8x la densité de référence
    const count = Math.max(8, Math.floor(((w * h) / 9000) * factor));
    const speedBoost = 1 + t * 1.1;
    const lenBoost = 1 + t * 0.7;
    rainDrops = [];
    for (let i = 0; i < count; i++) {
      rainDrops.push({
        x: Math.random() * w,
        y: Math.random() * h,
        len: (10 + Math.random() * 16) * lenBoost,
        speed: (5 + Math.random() * 6) * speedBoost,
        opacity: (0.12 + Math.random() * 0.28) * (0.85 + t * 0.4)
      });
    }
  }

  function initSnowFlakes() {
    const w = weatherCanvas.width, h = weatherCanvas.height;
    const t = Math.max(0, Math.min(1, (snowIntensity - 10) / 90));
    const factor = 0.22 + Math.pow(t, 1.3) * 3.4;
    const count = Math.max(8, Math.floor(((w * h) / 13000) * factor));
    snowFlakes = [];
    for (let i = 0; i < count; i++) {
      snowFlakes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 1.3 + Math.random() * 2.4,
        speed: (0.5 + Math.random() * 1.3) * (1 + t * 0.6),
        drift: 0.3 + Math.random() * 0.8,
        phase: Math.random() * Math.PI * 2,
        opacity: 0.35 + Math.random() * 0.45
      });
    }
  }

  function stepWeatherParticles() {
    const w = weatherCanvas.width, h = weatherCanvas.height;
    weatherCtx.clearRect(0, 0, w, h);

    if (weatherRain) {
      const t = Math.max(0, Math.min(1, (rainIntensity - 10) / 90));
      weatherCtx.strokeStyle = "rgba(200, 220, 255, 0.6)";
      weatherCtx.lineWidth = 1 + t * 0.8;
      const slant = 0.22;
      for (const d of rainDrops) {
        weatherCtx.globalAlpha = d.opacity;
        weatherCtx.beginPath();
        weatherCtx.moveTo(d.x, d.y);
        weatherCtx.lineTo(d.x - d.len * slant, d.y - d.len);
        weatherCtx.stroke();
        d.y += d.speed;
        d.x -= d.speed * slant * 0.5;
        if (d.y > h) { d.y = -10; d.x = Math.random() * w; }
        if (d.x < -20) d.x = w + 20;
      }
    }

    if (weatherSnow) {
      weatherCtx.fillStyle = "rgba(255, 255, 255, 1)";
      for (const f of snowFlakes) {
        weatherCtx.globalAlpha = f.opacity;
        weatherCtx.beginPath();
        weatherCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        weatherCtx.fill();
        f.y += f.speed;
        f.x += Math.sin((f.y + f.phase * 50) * 0.02) * f.drift * 0.6;
        if (f.y > h) { f.y = -6; f.x = Math.random() * w; }
        if (f.x < -10) f.x = w + 10;
        if (f.x > w + 10) f.x = -10;
      }
    }

    weatherCtx.globalAlpha = 1;
    weatherAnimId = requestAnimationFrame(stepWeatherParticles);
  }

  // Génère une texture de brouillard tuilable : des volutes irrégulières
  // (ellipses étirées, orientées et dosées au hasard), jamais des ronds
  // alignés en grille — dessinée une seule fois, pas recalculée en continu.
  function makeFogTexture(size, blobCount, alphaMin, alphaMax) {
    const canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");

    function drawBlobAt(cx, cy, rx, ry, rot, alpha) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      const maxR = Math.max(rx, ry);
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, maxR);
      grad.addColorStop(0, "rgba(255,255,255," + alpha + ")");
      grad.addColorStop(0.55, "rgba(255,255,255," + (alpha * 0.45) + ")");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (let i = 0; i < blobCount; i++) {
      const x = Math.random() * size;
      const y = Math.random() * size;
      const rx = size * (0.045 + Math.random() * 0.09);
      const ry = rx * (0.35 + Math.random() * 0.6); // étiré, pas rond
      const rot = Math.random() * Math.PI * 2;
      const alpha = alphaMin + Math.random() * (alphaMax - alphaMin);
      // on redessine chaque volute décalée d'une taille de tuile dans les
      // 8 directions voisines pour que le bord se raccorde sans couture
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          drawBlobAt(x + dx * size, y + dy * size, rx, ry, rot, alpha);
        }
      }
    }
    return canvas.toDataURL();
  }

  let fogTexturesReady = false;
  function ensureFogTextures() {
    if (fogTexturesReady) return;
    const ft1 = document.querySelector("#weather-fog .ft1");
    const ft2 = document.querySelector("#weather-fog .ft2");
    ft1.style.backgroundImage = "url(" + makeFogTexture(640, 55, 0.05, 0.13) + ")";
    ft2.style.backgroundImage = "url(" + makeFogTexture(460, 42, 0.04, 0.11) + ")";
    fogTexturesReady = true;
  }

  function renderWeather() {

  async function loadSceneFromDisk(folderName) {
    let sceneDir;
    try {
      sceneDir = await rootDirHandle.getDirectoryHandle(folderName);
    } catch (e) {
      showToast("Dossier de scène introuvable.", true);
      return;
    }
    let sceneData;
    try {
      const jsonFh = await sceneDir.getFileHandle("scene.json");
      const jsonFile = await jsonFh.getFile();
      sceneData = JSON.parse(await jsonFile.text());
    } catch (e) {
      sceneData = { name: folderName, background: null, music: null, zones: [] };
    }

    if (bgObjectURL) URL.revokeObjectURL(bgObjectURL);
    bgObjectURL = null;
    if (sceneData.background) {
      try {
        const fh = await sceneDir.getFileHandle(sceneData.background);
        const file = await fh.getFile();
        bgObjectURL = URL.createObjectURL(file);
      } catch (e) {}
    }

    if (musicObjectURL) URL.revokeObjectURL(musicObjectURL);
    musicObjectURL = null;
    musicAudioEl.pause();
    if (sceneData.music) {
      try {
        const musiquesDir = await sceneDir.getDirectoryHandle("musiques");
        const fh = await musiquesDir.getFileHandle(sceneData.music);
        const file = await fh.getFile();
        musicObjectURL = URL.createObjectURL(file);
      } catch (e) {}
    }
    musicAudioEl.src = musicObjectURL || "";

    diskMode = true;
    currentSceneDirHandle = sceneDir;
    currentSceneName = folderName;
    currentSceneMeta = { background: sceneData.background, music: sceneData.music };
    loadedSceneNames[folderName] = sceneData.name || folderName;

    ZONES.length = 0;
    (sceneData.zones || []).forEach(z => ZONES.push(z));
    await hydrateAssetURLs(ZONES, sceneDir);

    activeNpcOrder = Array.isArray(sceneData.activeNpcs) ? sceneData.activeNpcs.slice() : [];

    if (typeof sceneData.weatherRain === "boolean" || typeof sceneData.weatherFog === "boolean") {
      weatherRain = !!sceneData.weatherRain;
      weatherSnow = !!sceneData.weatherSnow;
      weatherFog = !!sceneData.weatherFog;
      weatherStorm = !!sceneData.weatherStorm;
    } else {
      // ancien format (un seul effet à la fois) : on migre en douceur
      weatherRain = sceneData.weather === "rain";
      weatherSnow = false;
      weatherFog = sceneData.weather === "fog";
      weatherStorm = false;
    }
    weatherRainToggle.checked = weatherRain;
    weatherSnowToggle.checked = weatherSnow;
    weatherFogToggle.checked = weatherFog;
    weatherStormToggle.checked = weatherStorm;
    rainIntensity = sceneData.rainIntensity || 50;
    rainIntensityInput.value = rainIntensity;
    snowIntensity = sceneData.snowIntensity || 50;
    snowIntensityInput.value = snowIntensity;
    musicVolume = (typeof sceneData.musicVolume === "number") ? sceneData.musicVolume : 70;
    musicVolumeInput.value = musicVolume;
    musicAudioEl.volume = musicVolume / 100;
    renderWeather();

    state.sceneId = folderName;
    state.insertStack = [];
    state.selectedZoneId = null;
    diskSceneSelect.value = folderName;
    diskDeleteBtn.dataset.confirm = "";
    diskDeleteBtn.textContent = "🗑️ Supprimer la scène";
    updateDeleteBtnVisibility();

    if (state.mode !== "player") {
      // démarrage auto de l'ambiance au changement de scène, mais
      // uniquement côté MJ/édition — jamais côté vue Joueur, pour éviter
      // le double son si les deux fenêtres tournent sur la même machine
      state.audioEnabled = true;
      audioBtn.classList.add("on");
      audioBtn.textContent = "🔊 Son activé";
      stopAmbient();
      if (musicObjectURL) musicAudioEl.play().catch(() => {});
    } else if (state.audioEnabled) {
      stopAmbient();
      if (musicObjectURL) musicAudioEl.play().catch(() => {});
    }

    broadcastState();
    render();
    hydrateActiveNpcImages();
  }

  async function createSceneOnDisk(name, bgFile, musicFile) {
    const folderName = slugify(name) || ("scene-" + Date.now());
    const sceneDir = await rootDirHandle.getDirectoryHandle(folderName, { create: true });
    await sceneDir.getDirectoryHandle("inserts", { create: true });
    await sceneDir.getDirectoryHandle("sons", { create: true });
    await sceneDir.getDirectoryHandle("musiques", { create: true });

    const bgExt = (bgFile.name.split(".").pop() || "jpg").toLowerCase();
    const bgDestName = "background." + bgExt;
    await writeFileIntoDir(sceneDir, bgDestName, bgFile);

    let musicDestName = null;
    if (musicFile) {
      const musiquesDir = await sceneDir.getDirectoryHandle("musiques", { create: true });
      const mExt = (musicFile.name.split(".").pop() || "mp3").toLowerCase();
      musicDestName = "musique." + mExt;
      await writeFileIntoDir(musiquesDir, musicDestName, musicFile);
    }

    const sceneData = { name: name, background: bgDestName, music: musicDestName, zones: [], activeNpcs: [], weatherRain: false, weatherSnow: false, weatherFog: false, weatherStorm: false, rainIntensity: 50, snowIntensity: 50, musicVolume: 70 };
    await writeJsonIntoDir(sceneDir, "scene.json", sceneData);
    return folderName;
  }

  // Répond à une nouvelle fenêtre qui nous demande le dossier déjà
  // sélectionné (transfert de la "poignée" par postMessage — façon
  // documentée de faire voyager ce genre d'objet entre fenêtres).
  window.addEventListener("message", (ev) => {
    if (!ev.data || ev.data.type !== "request-root-handle") return;
    if (!rootDirHandle || !ev.source) return;
    try {
      ev.source.postMessage({ type: "root-handle", rootDirHandle: rootDirHandle }, "*");
    } catch (e) {
      showToast("Impossible de transmettre le dossier à la nouvelle fenêtre.", true);
    }
  });

    if (!rootDirHandle) {

    let features = "width=1280,height=800";
    try {
      if ("getScreenDetails" in window) {
        const details = await window.getScreenDetails();
        const other = details.screens.find(s => s !== details.currentScreen);
        if (other) {
          features = "left=" + other.availLeft + ",top=" + other.availTop +
                     ",width=" + other.availWidth + ",height=" + other.availHeight;
        }
      }
    } catch (e) {
      // API indisponible, ou permission refusée : on ouvre en fenêtre normale

  // ---------------------------------------------------------------
  // Audio (Web Audio synthétisé — simule les 3 comportements sonores)
  // ---------------------------------------------------------------

  let actx = null;
  let ambientNode = null;
  let superposeNode = null;

  function ensureAudio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    return actx;
  }

  function startAmbient(hue) {
    stopAmbient();
    const ctx = ensureAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 90 + hue * 0.15;
    gain.gain.value = 0.04;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    ambientNode = { osc, gain };
  }
  function stopAmbient() {
    if (ambientNode) { try { ambientNode.osc.stop(); } catch (e) {} ambientNode = null; }
  }
  function toggleSuperpose(on) {
    if (on) {
      const ctx = ensureAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.value = 3.2; // rythme lent façon machine à laver
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.05;
      osc.connect(lfoGain).connect(ctx.destination);
      osc.start();
      superposeNode = { osc };
    } else if (superposeNode) {
      try { superposeNode.osc.stop(); } catch (e) {}
      superposeNode = null;
    }
  }
  function playSting() {
    const ctx = ensureAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  }
