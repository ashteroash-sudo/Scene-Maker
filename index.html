  // ---------------------------------------------------------------
  // Résolution d'un chemin d'inserts (pour retrouver une zone imbriquée)
  // ---------------------------------------------------------------

  function findZoneAtLevel(stack) {
    // stack = liste d'ids de zones ouvertes, dans l'ordre. Renvoie la liste
    // de zones à afficher au niveau courant (racine si stack vide).
    let list = ZONES;
    let current = null;
    for (const id of stack) {
      current = list.find(z => z.id === id);
      if (!current || !current.insert || !current.insert.nested) return { list: [], current };
      list = current.insert.nested;
    }
    return { list, current };
  }

  function getZoneById(id, stack) {
    const { list } = findZoneAtLevel(stack.slice(0, -1));
    return list.find(z => z.id === id);
  }

  // ---------------------------------------------------------------
  // Rendu
  // ---------------------------------------------------------------

  function render() {
    body.className = "mode-" + state.mode;
    sceneBg.src = diskMode ? (bgObjectURL || "") : window.__SCENE_IMG__;
    renderBaseZones();
    renderInserts();
    renderNpcPortraits();
    renderNpcChecklist();
    renderBreadcrumb();
    renderZoneInfo();
    renderHint();
  }

  function renderBaseZones() {
    svg.innerHTML = "";
    labelsLayer.innerHTML = "";
    if (state.insertStack.length > 0) return; // zones racine masquées si un insert est ouvert
    for (const zone of ZONES) {
      svg.appendChild(makeShape(zone, []));
      labelsLayer.appendChild(makeLabel(zone));
    }
  }

  function makeShape(zone, parentStack) {
    const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    poly.setAttribute("points", zone.points);
    poly.classList.add("zone-shape");
    poly.dataset.zoneId = zone.id;
    if (zone.type === "son" && zone.soundMode === "superpose" && state.soundOn[zone.id]) {
      poly.classList.add("sound-on");
    }
    poly.addEventListener("click", () => onZoneClick(zone, parentStack));
    return poly;
  }

  function centroid(pointsAttr) {
    const pts = pointsAttr.trim().split(/\s+/).map(p => p.split(",").map(Number));
    const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
    const cy = Math.min(...pts.map(p => p[1]));
    return { x: cx, y: cy };
  }

  function makeLabel(zone) {
    const div = document.createElement("div");
    div.className = "zone-label";
    div.textContent = zone.icon + " " + zone.name;
    const c = centroid(zone.points);
    const stageBox = document.getElementById("stage").getBoundingClientRect();
    div.style.left = (c.x / 768 * 100) + "%";
    div.style.top = (c.y / 512 * 100) + "%";
    return div;
  }

  function renderInserts() {
    insertLayer.innerHTML = "";
    let depth = 0;
    let stack = [];
    for (const id of state.insertStack) {
      const { list } = findZoneAtLevel(stack);
      const zone = list.find(z => z.id === id);
      if (!zone) break;
      const cardEl = zone.type === "personnage" ? makePortraitCard(zone, depth, stack.slice()) : makeInsertCard(zone, depth, stack.slice());
      insertLayer.appendChild(cardEl);
      stack.push(id);
      depth++;
    }
    // zones imbriquées du niveau courant (à l'intérieur du dernier insert affiché)
    if (state.insertStack.length > 0) {
      const lastCard = insertLayer.lastElementChild;
      if (lastCard) {
        const svgWrap = lastCard.querySelector(".insert-zone-svg");
        const { list } = findZoneAtLevel(state.insertStack);
        if (svgWrap && list.length) {
          for (const zone of list) {
            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute("points", zone.points);
            poly.classList.add("zone-shape");
            poly.dataset.zoneId = zone.id;
            poly.addEventListener("click", (e) => {
              e.stopPropagation();
              onZoneClick(zone, state.insertStack.slice());
            });
            svgWrap.appendChild(poly);
          }
        }
      }
    }
  }

  function makePortraitCard(zone, depth, parentStack) {
    const card = document.createElement("div");
    card.className = "portrait-card";
    card.style.zIndex = 20 + depth;

    const closeBtn = document.createElement("button");
    closeBtn.className = "portrait-close";
    closeBtn.textContent = "✕";
    closeBtn.title = "Fermer";
    closeBtn.addEventListener("click", () => setInsertStack(parentStack));

    const visual = document.createElement("div");
    visual.className = "portrait-visual";
    if (zone.insert._url) {
      visual.innerHTML = '<img class="portrait-img" src="' + zone.insert._url + '">';
    } else {
      visual.innerHTML =
        '<div class="portrait-placeholder">' +
          '<div class="icon">' + (zone.insert.icon || "🧍") + '</div>' +
          '<div class="cap">' + zone.insert.caption + '</div>' +
        '</div>';
    }

    const nameTag = document.createElement("div");
    nameTag.className = "portrait-name";
    nameTag.textContent = zone.name;

    const zoneSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    zoneSvg.classList.add("zones", "insert-zone-svg");
    zoneSvg.setAttribute("viewBox", "0 0 768 512");
    zoneSvg.setAttribute("preserveAspectRatio", "none");
    zoneSvg.style.position = "absolute";
    zoneSvg.style.inset = "0";
    zoneSvg.style.width = "100%";
    zoneSvg.style.height = "100%";

    card.appendChild(visual);
    card.appendChild(nameTag);
    card.appendChild(closeBtn);
    card.appendChild(zoneSvg);
    return card;
  }

  function makeInsertCard(zone, depth, parentStack) {
    const card = document.createElement("div");
    card.className = "insert-card";
    const offset = depth * 4;
    card.style.top = (11 - offset) + "%";
    card.style.left = (11 + offset) + "%";
    card.style.width = (78 - offset * 1.4) + "%";
    card.style.height = (78 - offset * 1.4) + "%";
    card.style.zIndex = 10 + depth;

    const head = document.createElement("div");
    head.className = "insert-head";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = (zone.insert.icon || "") + " " + zone.insert.title;
    const closeBtn = document.createElement("button");
    closeBtn.className = "close-btn";
    closeBtn.textContent = "✕";
    closeBtn.title = "Fermer";
    closeBtn.addEventListener("click", () => {
      setInsertStack(parentStack);
    });
    head.appendChild(name);
    head.appendChild(closeBtn);

    const bodyWrap = document.createElement("div");
    bodyWrap.className = "insert-body";

    const placeholder = document.createElement("div");
    placeholder.className = "insert-placeholder";
    if (zone.insert._url) {
      placeholder.style.background = "#000";
      placeholder.innerHTML = '<img src="' + zone.insert._url + '" style="max-width:100%;max-height:100%;object-fit:contain;">';
    } else {
      placeholder.innerHTML =
        '<div class="icon">' + (zone.insert.icon || "🖼️") + '</div>' +
        '<div class="cap">' + zone.insert.caption + '</div>';
    }
    bodyWrap.appendChild(placeholder);

    const zoneSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    zoneSvg.classList.add("zones", "insert-zone-svg");
    zoneSvg.setAttribute("viewBox", "0 0 768 512");
    zoneSvg.setAttribute("preserveAspectRatio", "none");
    zoneSvg.style.position = "absolute";
    zoneSvg.style.inset = "0";
    zoneSvg.style.width = "100%";
    zoneSvg.style.height = "100%";
    bodyWrap.appendChild(zoneSvg);

    card.appendChild(head);
    card.appendChild(bodyWrap);
    return card;
  }

  function renderBreadcrumb() {
    breadcrumbEl.innerHTML = "";
    const root = document.createElement("span");
    root.className = "crumb" + (state.insertStack.length === 0 ? " current" : "");
    root.textContent = diskMode ? (state.sceneId ? (loadedSceneNames[state.sceneId] || state.sceneId) : "Aucune scène chargée") : SCENES[state.sceneId].name;
    root.addEventListener("click", () => setInsertStack([]));
    breadcrumbEl.appendChild(root);

    let stack = [];
    for (let i = 0; i < state.insertStack.length; i++) {
      const id = state.insertStack[i];
      const { list } = findZoneAtLevel(stack);
      const zone = list.find(z => z.id === id);
      if (!zone) break;
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "›";
      breadcrumbEl.appendChild(sep);

      const crumb = document.createElement("span");
      crumb.className = "crumb" + (i === state.insertStack.length - 1 ? " current" : "");
      crumb.textContent = zone.name;
      const targetStack = state.insertStack.slice(0, i + 1);
      crumb.addEventListener("click", () => setInsertStack(targetStack));
      breadcrumbEl.appendChild(crumb);
      stack.push(id);
    }
  }

  function renderZoneInfo() {
    if (state.mode === "player") { zoneInfoEl.innerHTML = ""; return; }
    const zone = state.selectedZoneId ? findZoneAnywhere(state.selectedZoneId) : null;
    if (!zone) {
      zoneInfoEl.innerHTML = '<span class="empty">Clique une zone pour voir ses réglages.</span>';
      return;
    }
    if (state.mode === "edit") {
      renderZoneInfoEdit(zone);
    } else {
      renderZoneInfoReadOnly(zone);
    }
  }

  function renderZoneInfoReadOnly(zone) {
    const typeLabel = { image: "Image insérée", son: "Son / musique", scene: "Changement de scène", personnage: "Personnage" }[zone.type] || zone.type;
    zoneInfoEl.innerHTML =
      row("Nom", zone.name) +
      row("Type", typeLabel) +
      (zone.type === "son" ? row("Mode", zone.soundMode === "unique" ? "Bruitage unique" : "Superposé (on/off)") : "") +
      (zone.type === "scene" ? row("Cible", diskMode ? (loadedSceneNames[zone.target] || zone.target) : (SCENES[zone.target] ? SCENES[zone.target].name : zone.target)) : "");
  }

  function escapeAttr(str) {
    return (str || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  }

  function renderZoneInfoEdit(zone) {
    const typeLabel = { image: "Image insérée", son: "Son / musique", scene: "Changement de scène", personnage: "Personnage" }[zone.type] || zone.type;
    zoneInfoEl.innerHTML =
      '<label class="zi-label">Nom</label>' +
      '<input type="text" id="zi-name" value="' + escapeAttr(zone.name) + '">' +
      row("Type", typeLabel) +
      (zone.type === "son" ?
        '<label class="zi-label">Mode sonore</label>' +
        '<select id="zi-sound-mode">' +
          '<option value="superpose"' + (zone.soundMode !== "unique" ? " selected" : "") + '>Superposé (on/off)</option>' +
          '<option value="unique"' + (zone.soundMode === "unique" ? " selected" : "") + '>Bruitage unique</option>' +
        '</select>'
        : "") +
      '<div class="zi-actions">' +
        (diskMode && (zone.type === "image" || zone.type === "personnage") ?
          '<button id="zi-assoc-image">' + ((zone.insert && zone.insert.assetFile) ? "Changer l'image (" + zone.insert.assetFile + ")" : "Associer une image") + '</button>'
          : "") +
        (diskMode && zone.type === "son" ?
          '<button id="zi-assoc-sound">' + (zone.assetFile ? "Changer le son (" + zone.assetFile + ")" : "Associer un son") + '</button>'
          : "") +
        '<button id="zi-redraw">Redessiner la forme</button>' +
        '<button id="zi-delete" class="danger">Supprimer la zone</button>' +
      '</div>';

    const nameInput = zoneInfoEl.querySelector("#zi-name");
    function commitName() {
      const val = nameInput.value.trim();
      if (val && val !== zone.name) {
        zone.name = val;
        renderBaseZones();
        renderInserts();
        renderBreadcrumb();
        if (diskMode) saveSceneToDisk();
      }
    }
    nameInput.addEventListener("blur", commitName);
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { commitName(); nameInput.blur(); }
    });

    const soundSel = zoneInfoEl.querySelector("#zi-sound-mode");
    if (soundSel) {
      soundSel.addEventListener("change", () => {
        zone.soundMode = soundSel.value;
        zone.icon = iconForType(zone.type, zone.soundMode);
        renderBaseZones();
        renderInserts();
        if (diskMode) saveSceneToDisk();
      });
    }

    zoneInfoEl.querySelector("#zi-redraw").addEventListener("click", () => startRedraw(zone));

    const assocImgBtn = zoneInfoEl.querySelector("#zi-assoc-image");
    if (assocImgBtn) {
      assocImgBtn.addEventListener("click", async () => {
        try {
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: "Images", accept: { "image/*": [".png", ".jpg", ".jpeg", ".webp", ".gif"] } }]
          });
          const file = await handle.getFile();
          const inserts = await currentSceneDirHandle.getDirectoryHandle("inserts", { create: true });
          const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
          const destName = zone.id + "." + ext;
          await writeFileIntoDir(inserts, destName, file);
          if (zone.insert._url) URL.revokeObjectURL(zone.insert._url);
          zone.insert.assetFile = destName;
          zone.insert._url = URL.createObjectURL(file);
          saveSceneToDisk();
          renderInserts();
          renderZoneInfo();
        } catch (e) {}
      });
    }

    const assocSoundBtn = zoneInfoEl.querySelector("#zi-assoc-sound");
    if (assocSoundBtn) {
      assocSoundBtn.addEventListener("click", async () => {
        try {
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: "Audio", accept: { "audio/*": [".mp3", ".wav", ".ogg", ".m4a"] } }]
          });
          const file = await handle.getFile();
          const sons = await currentSceneDirHandle.getDirectoryHandle("sons", { create: true });
          const ext = (file.name.split(".").pop() || "mp3").toLowerCase();
          const destName = zone.id + "." + ext;
          await writeFileIntoDir(sons, destName, file);
          if (zone._url) URL.revokeObjectURL(zone._url);
          zone.assetFile = destName;
          zone._url = URL.createObjectURL(file);
          delete zoneAudioEls[zone.id];
          saveSceneToDisk();
          renderZoneInfo();
        } catch (e) {}
      });
    }

    zoneInfoEl.querySelector("#zi-delete").addEventListener("click", (e) => {
      const btn = e.currentTarget;
      if (!btn.dataset.confirm) {
        btn.dataset.confirm = "1";
        btn.textContent = "Cliquer à nouveau pour confirmer";
        btn.dataset.timeout = setTimeout(() => {
          btn.dataset.confirm = "";
          btn.textContent = "Supprimer la zone";
        }, 4000);
      } else {
        clearTimeout(Number(btn.dataset.timeout));
        deleteZone(zone);
      }
    });
  }

  function row(k, v) {
    return '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
  }

  function findZoneAnywhere(id, list) {
    list = list || ZONES;
    for (const z of list) {
      if (z.id === id) return z;
      if (z.insert && z.insert.nested) {
        const found = findZoneAnywhere(id, z.insert.nested);
        if (found) return found;
      }
    }
    return null;
  }

  function findZoneContext(id, list, stackSoFar) {
    list = list || ZONES;
    stackSoFar = stackSoFar || [];
    for (let i = 0; i < list.length; i++) {
      const z = list[i];
      if (z.id === id) return { zone: z, list, index: i, parentStack: stackSoFar.slice() };
      if (z.insert && z.insert.nested) {
        const found = findZoneContext(id, z.insert.nested, stackSoFar.concat(z.id));
        if (found) return found;
      }
    }
    return null;
  }

  function deleteZone(zone) {
    const ctx = findZoneContext(zone.id);
    if (!ctx) return;
    ctx.list.splice(ctx.index, 1);
    if (state.selectedZoneId === zone.id) state.selectedZoneId = null;
    const idx = state.insertStack.indexOf(zone.id);
    if (idx !== -1) state.insertStack = state.insertStack.slice(0, idx);
    broadcastState();
    if (diskMode) saveSceneToDisk();
    render();
  }

  function startRedraw(zone) {
    const ctx = findZoneContext(zone.id);
    if (!ctx) return;
    cancelDrawing();
    setInsertStack(ctx.parentStack);
    startDrawing();
    if (drawing) drawing.replaceZoneId = zone.id;
  }

  function renderHint() {
    if (state.mode === "edit") {
      modeHint.textContent = "Mode édition — aperçu des zones existantes (la création de zone arrivera avec l'éditeur relié au disque).";
    } else if (state.mode === "mj") {
      modeHint.textContent = "Mode MJ — clique une zone pour déclencher son effet.";
    } else {
      modeHint.textContent = "";
    }
  }

  // ---------------------------------------------------------------
  // Interactions
  // ---------------------------------------------------------------

  function onZoneClick(zone, parentStack) {
    state.selectedZoneId = zone.id;

    if (state.mode === "edit") {
      renderZoneInfo();
      return; // en édition on ne fait qu'inspecter, pas de déclenchement réel
    }
    if (state.mode !== "mj") return;

    if (zone.type === "image" || zone.type === "personnage") {
      setInsertStack(parentStack.concat(zone.id));
    } else if (zone.type === "scene") {
      goToScene(zone.target);
    } else if (zone.type === "son") {
      if (zone.soundMode === "unique") {
        if (zone._url) {
          const a = new Audio(zone._url);
          a.play().catch(() => {});
        } else if (state.audioEnabled) {
          playSting();
        }
      } else {
        const nowOn = !state.soundOn[zone.id];
        state.soundOn = { ...state.soundOn, [zone.id]: nowOn };
        if (zone._url) {
          if (!zoneAudioEls[zone.id]) {
            const a = new Audio(zone._url);
            a.loop = true;
            zoneAudioEls[zone.id] = a;
          }
          if (nowOn) zoneAudioEls[zone.id].play().catch(() => {});
          else zoneAudioEls[zone.id].pause();
        } else if (state.audioEnabled) {
          toggleSuperpose(nowOn);
        }
        broadcastState();
        render();
      }
    }
    renderZoneInfo();
  }

  function setInsertStack(stack) {
    state.insertStack = stack;
    broadcastState();
    render();
  }

  function goToScene(sceneId) {
    if (diskMode) {
      loadSceneFromDisk(sceneId);
      return;
    }
    state.sceneId = sceneId;
    state.insertStack = [];
    if (state.audioEnabled) startAmbient(SCENES[sceneId].musicHue);
    broadcastState();
    render();
  }

  document.querySelectorAll(".mode-switch button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mode-switch button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.mode = btn.dataset.mode;
      if (state.mode === "player") requestStateFromPeers();
      if (state.mode !== "edit") cancelDrawing();
      closeNotesFloating();
      updateDeleteBtnVisibility();
      render();
      if (weatherRain || weatherSnow) resizeWeatherCanvas();
    });
  });

  // ---------------------------------------------------------------
  // Dessin de zone en lasso (mode édition)
  // ---------------------------------------------------------------

  let drawing = null; // { svg, points, capture, previewLine, vertices[] }

  function iconForType(type, soundMode) {
    if (type === "image") return "🔍";
    if (type === "personnage") return "🧍";
    if (type === "scene") return "🚪";
    if (type === "son") return soundMode === "unique" ? "🎵" : "🔊";
    return "❔";
  }

  function slugify(str) {
    return (str || "").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "zone";
  }

  function getActiveDrawingSvg() {
    if (state.insertStack.length === 0) return svg;
    const cards = insertLayer.querySelectorAll(".insert-card");
    if (!cards.length) return null;
    return cards[cards.length - 1].querySelector(".insert-zone-svg");
  }

  function getInsertionList(stack) {
    if (stack.length === 0) return ZONES;
    let list = ZONES;
    let current = null;
    for (const id of stack) {
      current = list.find(z => z.id === id);
      if (!current) return null;
      if (!current.insert) current.insert = { title: current.name, caption: "", icon: current.icon };
      if (!current.insert.nested) current.insert.nested = [];
      list = current.insert.nested;
    }
    return list;
  }

  function svgPointFromEvent(svgEl, evt) {
    const pt = svgEl.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    const ctm = svgEl.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    const p = pt.matrixTransform(ctm.inverse());
    return { x: p.x, y: p.y };
  }

  const drawToggleBtn = document.getElementById("draw-toggle");
  drawToggleBtn.addEventListener("click", () => {
    if (drawing) { cancelDrawing(); return; }
    startDrawing();
  });

  function startDrawing() {
    const target = getActiveDrawingSvg();
    if (!target) return;
    body.classList.add("drawing-mode");
    drawToggleBtn.classList.add("on");
    drawToggleBtn.textContent = "✕ Annuler le dessin";

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.classList.add("draw-temp");

    const capture = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    capture.setAttribute("x", "0"); capture.setAttribute("y", "0");
    capture.setAttribute("width", "768"); capture.setAttribute("height", "512");
    capture.classList.add("draw-capture");
    g.appendChild(capture);

    const previewLine = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    previewLine.classList.add("draw-preview-line");
    g.appendChild(previewLine);

    target.appendChild(g);

    drawing = { svg: target, points: [], g, capture, previewLine, vertices: [] };

    const bar = document.createElement("div");
    bar.className = "draw-hint-bar";
    bar.id = "draw-hint-bar";
    bar.textContent = "Clique pour poser des points (min. 3) • Entrée pour terminer • Échap pour annuler";
    document.getElementById("stage").appendChild(bar);

    capture.addEventListener("click", onDrawClick);
    document.addEventListener("keydown", onDrawKeydown);
  }

  function onDrawClick(evt) {
    if (!drawing) return;
    const p = svgPointFromEvent(drawing.svg, evt);
    drawing.points.push(p);

    const vertex = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    vertex.classList.add("draw-vertex");
    vertex.setAttribute("cx", p.x);
    vertex.setAttribute("cy", p.y);
    vertex.setAttribute("r", "5");
    drawing.g.appendChild(vertex);
    drawing.vertices.push(vertex);

    updateDrawPreview();
  }

  function updateDrawPreview() {
    const pts = drawing.points.map(p => p.x + "," + p.y).join(" ");
    drawing.previewLine.setAttribute("points", pts);
  }

  function onDrawKeydown(evt) {
    if (evt.key === "Escape") { cancelDrawing(); }
    else if (evt.key === "Enter") { finishDrawing(); }
    else if (evt.key === "Backspace" && drawing && drawing.points.length) {
      drawing.points.pop();
      const v = drawing.vertices.pop();
      if (v) v.remove();
      updateDrawPreview();
    }
  }

  function teardownDrawingVisuals() {
    if (!drawing) return;
    drawing.capture.removeEventListener("click", onDrawClick);
    document.removeEventListener("keydown", onDrawKeydown);
    if (drawing.g.parentNode) drawing.g.remove();
    const bar = document.getElementById("draw-hint-bar");
    if (bar) bar.remove();
    body.classList.remove("drawing-mode");
    drawToggleBtn.classList.remove("on");
    drawToggleBtn.textContent = "✏️ Créer une zone";
  }

  function cancelDrawing() {
    if (!drawing) return;
    teardownDrawingVisuals();
    drawing = null;
  }

  function finishDrawing() {
    if (!drawing || drawing.points.length < 3) return;
    const pointsStr = drawing.points.map(p => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
    const replaceId = drawing.replaceZoneId;
    const parentStack = state.insertStack.slice();
    teardownDrawingVisuals();
    drawing = null;
    if (replaceId) {
      const ctx = findZoneContext(replaceId);
      if (ctx) ctx.zone.points = pointsStr;
      if (diskMode) saveSceneToDisk();
      render();
    } else {
      openZoneForm(pointsStr, parentStack);
    }
  }

  function openZoneForm(pointsStr, parentStack) {
    const overlay = document.createElement("div");
    overlay.className = "zone-form-overlay";
    overlay.innerHTML =
      '<div class="zone-form">' +
        '<h4>Nouvelle zone</h4>' +
        '<label>Nom de la zone</label>' +
        '<input type="text" id="zf-name" placeholder="Ex. Tiroir du bas">' +
        '<label>Comportement</label>' +
        '<select id="zf-type">' +
          '<option value="image">Image insérée</option>' +
          '<option value="son">Son / musique</option>' +
          '<option value="scene">Changement de scène</option>' +
        '</select>' +
        '<div id="zf-son-mode-wrap">' +
          '<label>Mode sonore</label>' +
          '<select id="zf-son-mode">' +
            '<option value="superpose">Superposé (on/off)</option>' +
            '<option value="unique">Bruitage unique</option>' +
          '</select>' +
        '</div>' +
        '<div id="zf-scene-target-wrap" style="display:none">' +
          '<label>Scène cible</label>' +
          '<select id="zf-scene-target"></select>' +
        '</div>' +
        '<div class="form-actions">' +
          '<button id="zf-cancel">Annuler</button>' +
          '<button id="zf-create" class="primary">Créer la zone</button>' +
        '</div>' +
        '<div class="note">' + (diskMode ? "L'image ou le son associé se choisissent après création, dans le panneau de la zone." : "La création réelle de fichier (image/son associé) arrivera avec le branchement disque — pour l'instant la zone reste en mémoire du navigateur.") + '</div>' +
      '</div>';
    document.getElementById("stage").appendChild(overlay);

    const typeSel = overlay.querySelector("#zf-type");
    const sonWrap = overlay.querySelector("#zf-son-mode-wrap");
    const sceneWrap = overlay.querySelector("#zf-scene-target-wrap");
    const sceneTargetSel = overlay.querySelector("#zf-scene-target");
    if (diskMode) {
      scenesList.forEach(n => {
        if (n === currentSceneName) return;
        const opt = document.createElement("option");
        opt.value = n;
        opt.textContent = loadedSceneNames[n] || n;
        sceneTargetSel.appendChild(opt);
      });
    }
    function syncTypeVisibility() {
      sonWrap.style.display = typeSel.value === "son" ? "block" : "none";
      sceneWrap.style.display = (typeSel.value === "scene" && diskMode) ? "block" : "none";
    }
    syncTypeVisibility();
    typeSel.addEventListener("change", syncTypeVisibility);

    overlay.querySelector("#zf-cancel").addEventListener("click", () => overlay.remove());

    overlay.querySelector("#zf-create").addEventListener("click", () => {
      const nameInput = overlay.querySelector("#zf-name");
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }
      const type = typeSel.value;
      const soundMode = overlay.querySelector("#zf-son-mode").value;
      const baseId = slugify(name) + "-" + Math.random().toString(36).slice(2, 6);

      const zone = {
        id: baseId,
        name: name,
        points: pointsStr,
        type: type,
        icon: iconForType(type, soundMode)
      };
      if (type === "son") {
        zone.soundMode = soundMode;
        zone.cue = "Zone créée en édition — son à associer plus tard.";
      } else if (type === "image" || type === "personnage") {
        zone.insert = {
          title: name,
          caption: "Emplacement réservé : asset à associer une fois le branchement disque en place.",
          icon: iconForType(type, soundMode)
        };
      } else if (type === "scene") {
        if (diskMode && sceneTargetSel.value) {
          zone.target = sceneTargetSel.value;
        } else if (!diskMode) {
          const sceneId = baseId + "-scene";
          SCENES[sceneId] = { name: name, musicHue: 40 + Math.floor(Math.random() * 300) };
          zone.target = sceneId;
        }
      }

      const list = getInsertionList(parentStack);
      if (list) list.push(zone);
      overlay.remove();
      if (diskMode) saveSceneToDisk();
      render();
    });
  }

  // ---------------------------------------------------------------
  // Synchro MJ -> Joueur (onglets dupliqués) via BroadcastChannel
  // ---------------------------------------------------------------

  function broadcastState() {
    if (!bc) return;
    bc.postMessage({
      type: "state",
      sceneId: state.sceneId,
      insertStack: state.insertStack,
      soundOn: state.soundOn,
      activeNpcOrder: activeNpcOrder,
      weatherRain: weatherRain,
      weatherSnow: weatherSnow,
      weatherFog: weatherFog,
      weatherStorm: weatherStorm,
      rainIntensity: rainIntensity,
      snowIntensity: snowIntensity,
      musicVolume: musicVolume
    });
  }
  function requestStateFromPeers() {
    if (!bc) return;
    bc.postMessage({ type: "request-state" });
  }
  if (bc) {
    bc.onmessage = async (ev) => {
      const msg = ev.data;
      if (!msg) return;
      if (msg.type === "request-state" && state.mode !== "player") {
        broadcastState();
      } else if (msg.type === "state" && state.mode === "player") {
        // si la scène a changé côté MJ, on va la charger nous-mêmes depuis
        // le disque (chaque onglet a sa propre lecture du dossier) avant
        // d'appliquer le reste de l'état — sinon le fond/les zones restent
        // figés sur l'ancienne scène.
        const sceneChanged = rootDirHandle && msg.sceneId && msg.sceneId !== currentSceneName;
        if (sceneChanged) {
          await loadSceneFromDisk(msg.sceneId);
        }
        state.sceneId = msg.sceneId;
        state.insertStack = msg.insertStack;
        state.soundOn = msg.soundOn;
        activeNpcOrder = msg.activeNpcOrder || [];
        if (typeof msg.rainIntensity === "number") rainIntensity = msg.rainIntensity;
        if (typeof msg.snowIntensity === "number") snowIntensity = msg.snowIntensity;
        if (typeof msg.musicVolume === "number" && msg.musicVolume !== musicVolume) {
          musicVolume = msg.musicVolume;
          musicVolumeInput.value = musicVolume;
          musicAudioEl.volume = musicVolume / 100;
          rainAmbienceEl.volume = musicVolume / 100;
          stormAmbienceEl.volume = musicVolume / 100;
        }
        const weatherChanged = (typeof msg.weatherRain === "boolean" && msg.weatherRain !== weatherRain) ||
                                (typeof msg.weatherSnow === "boolean" && msg.weatherSnow !== weatherSnow) ||
                                (typeof msg.weatherFog === "boolean" && msg.weatherFog !== weatherFog) ||
                                (typeof msg.weatherStorm === "boolean" && msg.weatherStorm !== weatherStorm);
        if (typeof msg.weatherRain === "boolean") weatherRain = msg.weatherRain;
        if (typeof msg.weatherSnow === "boolean") weatherSnow = msg.weatherSnow;
        if (typeof msg.weatherFog === "boolean") weatherFog = msg.weatherFog;
        if (typeof msg.weatherStorm === "boolean") weatherStorm = msg.weatherStorm;
        weatherRainToggle.checked = weatherRain;
        weatherSnowToggle.checked = weatherSnow;
        weatherFogToggle.checked = weatherFog;
        weatherStormToggle.checked = weatherStorm;
        if (weatherChanged || sceneChanged) {
          renderWeather();
        } else {
          if (weatherRain) initRainDrops();
          if (weatherSnow) initSnowFlakes();
        }
        render();
        hydrateActiveNpcImages();
      }
    };
  }

  // ---------------------------------------------------------------
  // Notes de scénario (UN fichier PDF/TXT/MD pour tout le scénario,
  // à la racine du dossier — indépendant des scènes, position retenue)
  // ---------------------------------------------------------------

  let scenarioDocFileName = null;
  let scenarioDocKind = null; // 'pdf' | 'text'
  let scenarioDocPosition = 0; // scrollTop (texte) ou n° de page (pdf)
  let scenarioDocObjectURL = null;

  async function saveScenarioDocConfig() {
    if (!rootDirHandle) return;
    try {
      const fh = await rootDirHandle.getFileHandle("scenario-doc.json", { create: true });
      const w = await fh.createWritable();
      await w.write(JSON.stringify({
        fileName: scenarioDocFileName,
        kind: scenarioDocKind,
        position: scenarioDocPosition
      }, null, 2));
      await w.close();
    } catch (e) {}
  }

  async function loadScenarioDocConfig() {
    scenarioDocFileName = null;
    scenarioDocKind = null;
    scenarioDocPosition = 0;
    if (!rootDirHandle) { renderScenarioDoc(); return; }
    try {
      const fh = await rootDirHandle.getFileHandle("scenario-doc.json");
      const file = await fh.getFile();
      const cfg = JSON.parse(await file.text());
      scenarioDocFileName = cfg.fileName || null;
      scenarioDocKind = cfg.kind || null;
      scenarioDocPosition = cfg.position || 0;
    } catch (e) {
      // pas encore de fichier choisi pour ce scénario
    }
    await renderScenarioDoc();
  }

  async function pickScenarioDoc() {
    if (!rootDirHandle) { showToast("Ouvre d'abord un dossier de scénario.", true); return; }
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: "Scénario", accept: { "application/pdf": [".pdf"], "text/plain": [".txt"], "text/markdown": [".md"] } }]
      });
      const file = await handle.getFile();
      await writeFileIntoDir(rootDirHandle, file.name, file);
      scenarioDocFileName = file.name;
      scenarioDocKind = /\.pdf$/i.test(file.name) ? "pdf" : "text";
      scenarioDocPosition = 0;
      await saveScenarioDocConfig();
      await renderScenarioDoc();
    } catch (e) {
      // sélection annulée
    }
  }

  function updateNotesSummary() {
    const el = document.getElementById("notes-summary");
    if (!rootDirHandle) {
      el.innerHTML = '<span class="empty">Ouvre un dossier de scénario.</span>';
      return;
    }
    if (!scenarioDocFileName) {
      el.innerHTML = '<span class="empty">Aucun fichier choisi.</span>';
      return;
    }
    el.innerHTML = '<button id="notes-open-float" class="notes-open-btn">📖 ' + scenarioDocFileName + '</button>';
    document.getElementById("notes-open-float").addEventListener("click", toggleNotesFloating);
  }

  function openNotesFloating() {
    if (!scenarioDocFileName) return;
    const overlay = document.getElementById("notes-floating-overlay");
    overlay.classList.remove("hidden");
    document.getElementById("notes-floating-title").textContent = scenarioDocFileName;
    requestAnimationFrame(() => {
      const viewEl = document.querySelector("#notes-floating-body .doc-text-view");
      if (viewEl) viewEl.scrollTop = scenarioDocPosition || 0;
    });
  }

  function closeNotesFloating() {
    document.getElementById("notes-floating-overlay").classList.add("hidden");
  }

  function toggleNotesFloating() {
    const overlay = document.getElementById("notes-floating-overlay");
    if (overlay.classList.contains("hidden")) openNotesFloating();
    else closeNotesFloating();
  }

  document.getElementById("notes-floating-close").addEventListener("click", closeNotesFloating);
  document.getElementById("notes-floating-header").addEventListener("click", closeNotesFloating);
  document.getElementById("notes-floating-overlay").addEventListener("click", (e) => {
    if (e.target.id === "notes-floating-overlay") closeNotesFloating();
  });

  async function renderScenarioDoc() {
    updateNotesSummary();
    const el = document.getElementById("notes-floating-body");
    if (!rootDirHandle) {
      el.innerHTML = '<span class="empty">Ouvre un dossier de scénario.</span>';
      return;
    }
    if (!scenarioDocFileName) {
      el.innerHTML = '<span class="empty">Aucun fichier choisi — clique 📁 pour sélectionner ton PDF ou TXT de scénario.</span>';
      return;
    }
    let file;
    try {
      const fh = await rootDirHandle.getFileHandle(scenarioDocFileName);
      file = await fh.getFile();
    } catch (e) {
      el.innerHTML = '<span class="empty">Fichier introuvable ("' + scenarioDocFileName + '"). Clique 📁 pour en choisir un autre.</span>';
      return;
    }

    el.innerHTML = '<div class="doc-file-name">' + scenarioDocFileName + '</div>';

    if (scenarioDocKind === "pdf") {
      if (scenarioDocObjectURL) URL.revokeObjectURL(scenarioDocObjectURL);
      scenarioDocObjectURL = URL.createObjectURL(file);
      const page = scenarioDocPosition || 1;

      const controls = document.createElement("div");
      controls.className = "doc-pdf-controls";
      controls.innerHTML =
        '<label>Page</label>' +
        '<input type="number" id="doc-page-input" min="1" value="' + page + '">' +
        '<button id="doc-page-go">Reprendre ici</button>';
      el.appendChild(controls);

      const iframe = document.createElement("iframe");
      iframe.className = "note-pdf doc-pdf-frame";
      iframe.src = scenarioDocObjectURL + "#page=" + page;
      el.appendChild(iframe);

      document.getElementById("doc-page-go").addEventListener("click", () => {
        const val = parseInt(document.getElementById("doc-page-input").value, 10) || 1;
        scenarioDocPosition = val;
        saveScenarioDocConfig();
        iframe.src = scenarioDocObjectURL + "#page=" + val;
      });
    } else {
      const text = await file.text();
      const viewEl = document.createElement("div");
      viewEl.className = "note-text doc-text-view";
      viewEl.textContent = text;
      el.appendChild(viewEl);

      let saveTimeout = null;
      viewEl.addEventListener("scroll", () => {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          scenarioDocPosition = viewEl.scrollTop;
          saveScenarioDocConfig();
        }, 600);
      });
    }
  }

  document.getElementById("notes-pick").addEventListener("click", pickScenarioDoc);
  document.getElementById("notes-refresh").addEventListener("click", renderScenarioDoc);

  // ---------------------------------------------------------------
  // Si cette fenêtre a été ouverte par le bouton "Vue Joueur →" d'une
  // autre fenêtre du même outil, on demande le dossier déjà autorisé
  // là-bas, puis on bascule tout seul en vue Joueur (et on tente le
  // plein écran — ça peut être refusé par le navigateur puisque ce
  // n'est pas un clic direct dans CETTE fenêtre).
  function requestRootHandleFromOpener() {
    return new Promise((resolve) => {
      if (!window.opener) { resolve(null); return; }
      let settled = false;
      function onMsg(ev) {
        if (!ev.data || ev.data.type !== "root-handle") return;
        settled = true;
        window.removeEventListener("message", onMsg);
        resolve(ev.data.rootDirHandle || null);
      }
      window.addEventListener("message", onMsg);
      try {
        window.opener.postMessage({ type: "request-root-handle" }, "*");
      } catch (e) {}
      setTimeout(() => {
        if (!settled) {
          window.removeEventListener("message", onMsg);
          resolve(null);
        }
      }, 2000);
    });
  }

  async function bootstrapFromOpener() {
    const handle = await requestRootHandleFromOpener();
    if (!handle) return false;
    rootDirHandle = handle;
    await scanScenes();
    await scanNpcFolder();
    await scanMeteoFolder();

    document.querySelectorAll(".mode-switch button").forEach(b => b.classList.remove("active"));
    state.mode = "player";
    render();
    loadScenarioDocConfig();
    requestStateFromPeers();

    try {
      await document.documentElement.requestFullscreen();
    } catch (e) {
      showFullscreenPrompt();
    }
    return true;
  }

  // Si le plein écran auto est refusé (le navigateur exige un vrai clic
  // dans CETTE fenêtre), on affiche un gros bouton qui, lui, marchera à
  // coup sûr puisque c'est un clic direct.
  function showFullscreenPrompt() {
    const overlay = document.createElement("div");
    overlay.id = "fullscreen-prompt";
    overlay.style.cssText =
      "position:fixed;inset:0;z-index:999;display:flex;align-items:center;" +
      "justify-content:center;background:rgba(0,0,0,0.75);cursor:pointer;";
    overlay.innerHTML =
      '<div style="background:#10171d;border:1px solid rgba(201,169,97,0.4);' +
      'border-radius:12px;padding:28px 36px;text-align:center;color:#c9a961;' +
      'font-family:Georgia, serif;font-size:1.1rem;">' +
      '🖥️ Cliquer pour passer en plein écran</div>';
    overlay.addEventListener("click", () => {
      document.documentElement.requestFullscreen().catch(() => {
        showToast("Plein écran toujours refusé — F11 pour l'activer à la main.", true);
      });
      overlay.remove();
    });
    document.body.appendChild(overlay);
  }

  (async () => {
    const ok = await bootstrapFromOpener();
    if (!ok) {
      render();
      loadScenarioDocConfig();
    }
  })();
})();
</script>
</body>
</html>
